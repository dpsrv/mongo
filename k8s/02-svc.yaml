apiVersion: v1
kind: Service
metadata:
  namespace: dpsrv
  name: mongodb
  labels:
    app: mongodb
spec:
  ports:
    - port: 27017
      name: mongodb
  clusterIP: None # headless service for StatefulSet
  publishNotReadyAddresses: true # peers can discover each other before they are ready
  selector:
    app: mongodb
